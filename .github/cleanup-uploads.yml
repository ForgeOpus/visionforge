# GitHub Actions workflow to clean up uploaded files on Render
# This runs every 2 hours as a workaround for Render free tier lacking cron jobs
# The workflow calls the cleanup API endpoint which is protected by a secret token

name: Cleanup Uploaded Files

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger cleanup endpoint
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            "${{ secrets.CLEANUP_ENDPOINT_URL }}" \
            -d '{"secret": "${{ secrets.CLEANUP_SECRET }}"}'
