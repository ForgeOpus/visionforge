# Render configuration for VisionForge deployment
# https://render.com/docs/yaml-spec

services:
  # Django backend service
  - type: web
    name: visionforge-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd project
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: |
      cd project
      gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: False
      - key: ENVIRONMENT
        value: PROD
      - key: PYTHON_VERSION
        value: 3.11.0

